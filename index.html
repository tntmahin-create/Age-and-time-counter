<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f4bff">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Age and Time Counter</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14213d;--mute:#5d6b85;--acc:#2f4bff;--acc-ink:#fff;--gold:#f2b705;--line:#d5dcea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f36;--ink:#eaf0ff;--mute:#93a0bf;--acc:#7b8cff;--acc-ink:#0e1424;--gold:#f2c94c;--line:#2a3555}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f36;--ink:#eaf0ff;--mute:#93a0bf;--acc:#7b8cff;--acc-ink:#0e1424;--gold:#f2c94c;--line:#2a3555}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;border:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--mute);font:600 15px inherit;font-family:inherit;padding:11px 0;border-radius:10px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--acc);color:var(--acc-ink)}
section{display:none;margin-top:16px}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px}
.big{font-size:44px;font-weight:800;line-height:1.1;letter-spacing:-.02em;margin:14px 0 2px}
.big small{font-size:17px;font-weight:400;color:var(--mute);letter-spacing:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:var(--bg);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mute)}
.next{margin-top:14px;padding:12px;border-radius:12px;background:var(--gold);color:#14213d;font-weight:600}
.clock{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:10px 0 18px}
.row{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font:600 16px inherit;font-family:inherit;cursor:pointer;background:var(--acc);color:var(--acc-ink)}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hint{color:var(--mute);font-size:14px;margin:10px 0 0}
</style>
</head>
<body>
<main>
<nav role="tablist">
<button role="tab" aria-selected="true" data-t="age">Age</button>
<button role="tab" aria-selected="false" data-t="sw">Stopwatch</button>
<button role="tab" aria-selected="false" data-t="tm">Timer</button>
</nav>

<section id="age" class="on">
<div class="card">
<label for="dob">Date and time of birth</label>
<input id="dob" type="datetime-local">
<div id="ageOut" hidden>
<div class="big" id="ymd"></div>
<div class="grid">
<div class="stat"><b id="td">0</b><span>days</span></div>
<div class="stat"><b id="th">0</b><span>hours</span></div>
<div class="stat"><b id="tmn">0</b><span>minutes</span></div>
<div class="stat"><b id="ts">0</b><span>seconds</span></div>
</div>
<div class="next" id="nb"></div>
</div>
<p class="hint" id="ageHint">Pick your birth date to start the live counter.</p>
</div>
</section>

<section id="sw">
<div class="card">
<div class="clock" id="swT">00:00:00.0</div>
<div class="row"><button class="btn" id="swGo">Start</button><button class="btn alt" id="swReset">Reset</button></div>
</div>
</section>

<section id="tm">
<div class="card">
<div class="row" id="tmIn">
<div style="flex:1"><label for="mm">Minutes</label><input id="mm" type="number" min="0" max="999" value="5" inputmode="numeric"></div>
<div style="flex:1"><label for="ss">Seconds</label><input id="ss" type="number" min="0" max="59" value="0" inputmode="numeric"></div>
</div>
<div class="clock" id="tmT">05:00</div>
<div class="row"><button class="btn" id="tmGo">Start</button><button class="btn alt" id="tmReset">Reset</button></div>
<p class="hint" id="tmMsg"></p>
</div>
</section>
</main>

<script>
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,"0");
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===b.dataset.t));
});

/* Age */
let birth=null;
const saved=store("dob"); if(saved){$("dob").value=saved;birth=new Date(saved)}
$("dob").onchange=e=>{birth=e.target.value?new Date(e.target.value):null;store("dob",e.target.value);tickAge()};
function tickAge(){
  if(!birth||isNaN(birth)||birth>new Date()){$("ageOut").hidden=true;$("ageHint").hidden=false;return}
  $("ageOut").hidden=false;$("ageHint").hidden=true;
  const n=new Date();
  let y=n.getFullYear()-birth.getFullYear(),m=n.getMonth()-birth.getMonth(),d=n.getDate()-birth.getDate();
  if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  $("ymd").innerHTML=y+" <small>years</small> "+m+" <small>months</small><br>"+d+" <small>days</small>";
  const ms=n-birth;
  $("td").textContent=Math.floor(ms/864e5).toLocaleString();
  $("th").textContent=Math.floor(ms/36e5).toLocaleString();
  $("tmn").textContent=Math.floor(ms/6e4).toLocaleString();
  $("ts").textContent=Math.floor(ms/1e3).toLocaleString();
  let nx=new Date(n.getFullYear(),birth.getMonth(),birth.getDate());
  const t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  if(nx<t0)nx=new Date(n.getFullYear()+1,birth.getMonth(),birth.getDate());
  const left=Math.round((nx-t0)/864e5);
  $("nb").textContent=left===0?"Happy birthday! 🎂":left+" days until your next birthday";
}
setInterval(tickAge,1000);tickAge();

/* Stopwatch */
let swRun=false,swStart=0,swAcc=0,swId;
function swShow(){const t=swAcc+(swRun?Date.now()-swStart:0);
  const h=Math.floor(t/36e5),m=Math.floor(t/6e4)%60,s=Math.floor(t/1e3)%60,f=Math.floor(t/100)%10;
  $("swT").textContent=pad(h)+":"+pad(m)+":"+pad(s)+"."+f}
$("swGo").onclick=()=>{
  if(swRun){swAcc+=Date.now()-swStart;swRun=false;clearInterval(swId);$("swGo").textContent="Resume"}
  else{swStart=Date.now();swRun=true;swId=setInterval(swShow,50);$("swGo").textContent="Pause"}
};
$("swReset").onclick=()=>{swRun=false;clearInterval(swId);swAcc=0;$("swGo").textContent="Start";swShow()};

/* Timer */
let tmRun=false,tmEnd=0,tmLeft=0,tmId;
const tmTotal=()=>(Math.max(0,+$("mm").value||0)*60+Math.min(59,Math.max(0,+$("ss").value||0)))*1000;
function tmShow(ms){const s=Math.ceil(ms/1000);$("tmT").textContent=pad(Math.floor(s/60))+":"+pad(s%60)}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();
  o.frequency.value=880;o.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},700)}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
function tmTick(){
  const r=tmEnd-Date.now();
  if(r<=0){clearInterval(tmId);tmRun=false;tmLeft=0;tmShow(0);$("tmGo").textContent="Start";$("tmMsg").textContent="Time is up!";beep();return}
  tmShow(r)}
$("tmGo").onclick=()=>{
  if(tmRun){tmLeft=tmEnd-Date.now();tmRun=false;clearInterval(tmId);$("tmGo").textContent="Resume";return}
  if(!tmLeft)tmLeft=tmTotal();
  if(!tmLeft){$("tmMsg").textContent="Set a time first.";return}
  $("tmMsg").textContent="";tmEnd=Date.now()+tmLeft;tmRun=true;$("tmGo").textContent="Pause";tmId=setInterval(tmTick,200);tmTick()
};
$("tmReset").onclick=()=>{tmRun=false;clearInterval(tmId);tmLeft=0;$("tmGo").textContent="Start";$("tmMsg").textContent="";tmShow(tmTotal())};
["mm","ss"].forEach(i=>$(i).oninput=()=>{if(!tmRun){tmLeft=0;tmShow(tmTotal())}});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
